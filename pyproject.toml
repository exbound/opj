[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opj"
version = "0.0.1"
description = "Independent, compatible reader for Origin project files (.opju / .opj)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "The opj Authors" }]
keywords = ["origin", "opju", "opj", "file-format", "scientific-data"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
opj = "opj.__main__:main"

[project.urls]
Homepage = "https://github.com/exbound/opj"
Research = "https://github.com/exbound/research"

[tool.hatch.build.targets.wheel]
packages = ["src/opj"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
